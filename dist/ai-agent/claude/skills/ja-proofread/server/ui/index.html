<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ja-proofread</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <span class="brand">ja-proofread</span>
    <span id="phase" class="phase"></span>
    <span id="message" class="message"></span>
    <span class="bar-spacer"></span>
    <span id="counts" class="counts" hidden></span>
    <span id="confirm" class="confirm" hidden>
      <span id="confirm-text"></span>
      <button id="confirm-yes" class="btn btn-primary" type="button">反映する</button>
      <button id="confirm-no" class="btn btn-quiet" type="button">戻る</button>
    </span>
    <button id="submit" class="btn btn-primary" type="button" hidden>反映する</button>
  </div>
</header>
<div class="layout">
  <nav id="toc" class="toc" aria-label="校閲箇所の一覧" hidden></nav>
  <main class="main">
    <section id="questions"></section>
    <section id="result" class="panel" hidden></section>
    <dl id="scope" class="scope" hidden></dl>
    <section id="progress" class="panel" hidden></section>
    <section id="files"></section>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
