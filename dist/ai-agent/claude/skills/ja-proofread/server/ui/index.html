<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ja-proofread</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <h1>ja-proofread</h1>
    <span id="phase" class="phase"></span>
    <span id="message" class="message"></span>
  </div>
</header>
<main>
  <section id="questions"></section>
  <section id="scope" class="panel" hidden></section>
  <section id="progress" class="panel" hidden></section>
  <section id="files"></section>
  <section id="result" class="panel" hidden></section>
</main>
<footer id="submitbar" class="submitbar" hidden>
  <div class="submitbar-inner">
    <span id="counts"></span>
    <span class="spacer"></span>
    <span id="confirm" hidden>
      <span id="confirm-text"></span>
      <button id="confirm-yes" class="primary">送信する</button>
      <button id="confirm-no">戻る</button>
    </span>
    <button id="submit" class="primary">Submit</button>
  </div>
</footer>
<script src="/app.js"></script>
</body>
</html>
